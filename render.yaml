services:
  - type: web
    name: travelwithnj-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SITE_URL
        value: https://travelwithnj.kalebuddelogistics.in
      - key: ADMIN_USERNAME
        value: travel_with.nj
      - key: ADMIN_EMAIL
        value: travelwithnj@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
