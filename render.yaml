services:
  - type: web
    name: travelwithnj-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: travelwithnj-db
          property: connectionString
      - key: SITE_URL
        value: https://travelwithnj.kalebuddelogistics.in
      - key: ADMIN_USERNAME
        value: travel_with.nj
      - key: ADMIN_EMAIL
        value: travelwithnj@gmail.com
      - key: ADMIN_PASSWORD
        value: TravelNJ@2026
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: travelwithnj-db
    databaseName: travelwithnj
    user: travelwithnj_user
    region: singapore
    plan: free
