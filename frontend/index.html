    <!-- Instant Theme Preloader (Prevents FOUC / Light Flash) -->

      (function() {
        try {
          var t = localStorage.getItem('sellerkit_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- GA4 Analytics - Non-blocking high-performance loader (0ms TBT impact) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8LF9KE5EWG', { send_page_view: true });

      (function() {
        var loaded = false;
        function loadGA() {
          if (loaded) return;
          loaded = true;
          ['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(function(ev) {
            window.removeEventListener(ev, loadGA, { passive: true });
          });
          var el = document.createElement('script');
          el.async = true;
          el.src = 'https://www.googletagmanager.com/gtag/js?id=G-8LF9KE5EWG';
          document.head.appendChild(el);
        }
        ['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(function(ev) {
          window.addEventListener(ev, loadGA, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) {
          window.addEventListener('load', function() {
            requestIdleCallback(function() { setTimeout(loadGA, 3000); });
          }, { once: true });
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadGA, 3500);
          }, { once: true });
        }
      })();
    </script>
