<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Etsy Offsite Ads Fee Impact Comparison (2026 Model)</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Comparing seller net profit across Organic Sales, Optional 15% Ads, and Mandatory 12% High-Volume Tier</text>

  <!-- Card 1: Organic Sale -->
  <rect x="30" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="42" y="115" width="202" height="30" rx="6" fill="#10b981" fill-opacity="0.15"/>
  <text x="143" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">Organic Sale (0% Ads)</text>
  
  <text x="54" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">Sale Price:</text>
  <text x="230" y="175" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$100.00</text>

  <text x="54" y="205" font-family="sans-serif" font-size="11" fill="#94a3b8">Crafting COGS:</text>
  <text x="230" y="205" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="end">-$50.00</text>

  <text x="54" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8">Standard Fees (9.5%):</text>
  <text x="230" y="235" font-family="monospace" font-size="12" fill="#f97316" text-anchor="end">-$9.95</text>

  <text x="54" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8">Offsite Ads Cut:</text>
  <text x="230" y="265" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold" text-anchor="end">$0.00</text>

  <line x1="44" y1="285" x2="242" y2="285" stroke="#334155"/>

  <text x="54" y="320" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">NET PROFIT:</text>
  <text x="230" y="320" font-family="monospace" font-size="22" font-weight="bold" fill="#10b981" text-anchor="end">$40.05</text>
  <text x="230" y="340" font-family="sans-serif" font-size="11" fill="#10b981" text-anchor="end">40.1% Margin</text>

  <rect x="42" y="365" width="202" height="30" rx="6" fill="#0f172a"/>
  <text x="143" y="384" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Maximum Profit Margin</text>

  <!-- Card 2: Optional 15% Ads -->
  <rect x="286" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="298" y="115" width="202" height="30" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="399" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">Optional Ads (&lt;$10k) 15%</text>

  <text x="310" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">Sale Price:</text>
  <text x="486" y="175" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$100.00</text>

  <text x="310" y="205" font-family="sans-serif" font-size="11" fill="#94a3b8">Crafting COGS:</text>
  <text x="486" y="205" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="end">-$50.00</text>

  <text x="310" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8">Standard Fees (9.5%):</text>
  <text x="486" y="235" font-family="monospace" font-size="12" fill="#f97316" text-anchor="end">-$9.95</text>

  <text x="310" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8">Offsite Ads (15%):</text>
  <text x="486" y="265" font-family="monospace" font-size="12" fill="#ef4444" text-anchor="end">-$15.00</text>

  <line x1="298" y1="285" x2="498" y2="285" stroke="#334155"/>

  <text x="310" y="320" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">NET PROFIT:</text>
  <text x="486" y="320" font-family="monospace" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="end">$25.05</text>
  <text x="486" y="340" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="end">25.1% Margin</text>

  <rect x="298" y="365" width="202" height="30" rx="6" fill="#0f172a"/>
  <text x="399" y="384" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Can Opt Out Any Time</text>

  <!-- Card 3: Mandatory 12% Ads -->
  <rect x="544" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="556" y="115" width="202" height="30" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <text x="657" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">Mandatory (&gt;$10k) 12%</text>

  <text x="568" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">Sale Price:</text>
  <text x="744" y="175" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$100.00</text>

  <text x="568" y="205" font-family="sans-serif" font-size="11" fill="#94a3b8">Crafting COGS:</text>
  <text x="744" y="205" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="end">-$50.00</text>

  <text x="568" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8">Standard Fees (9.5%):</text>
  <text x="744" y="235" font-family="monospace" font-size="12" fill="#f97316" text-anchor="end">-$9.95</text>

  <text x="568" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8">Offsite Ads (12%):</text>
  <text x="744" y="265" font-family="monospace" font-size="12" fill="#ef4444" text-anchor="end">-$12.00</text>

  <line x1="556" y1="285" x2="756" y2="285" stroke="#334155"/>

  <text x="568" y="320" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">NET PROFIT:</text>
  <text x="744" y="320" font-family="monospace" font-size="22" font-weight="bold" fill="#ef4444" text-anchor="end">$28.05</text>
  <text x="744" y="340" font-family="sans-serif" font-size="11" fill="#ef4444" text-anchor="end">28.1% Margin</text>

  <rect x="556" y="365" width="202" height="30" rx="6" fill="#0f172a"/>
  <text x="657" y="384" font-family="sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">Mandatory for Life</text>
</svg>
