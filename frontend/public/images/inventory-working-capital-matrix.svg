<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBatch2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradBatch2)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Catalog Working Capital &amp; Inventory Turnover Velocity Matrix</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">How capital allocation across catalog tiers impacts overall cash turnaround speed</text>

  <!-- 3 Boxes -->
  <!-- Box 1: Hero SKUs -->
  <rect x="30" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="42" y="115" width="202" height="30" rx="6" fill="#6366f1" fill-opacity="0.15"/>
  <text x="143" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">Hero Core SKUs (40-50%)</text>
  <text x="54" y="175" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Target Margin: 35% - 50%</text>
  <text x="54" y="205" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Turnover Speed: &lt; 30 Days</text>
  <text x="54" y="235" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Working Capital Role:</text>
  <text x="54" y="260" font-family="sans-serif" font-size="10" fill="#94a3b8">Drives 80% of daily cash flow, store keyword ranking, and customer volume.</text>
  <rect x="42" y="365" width="202" height="30" rx="6" fill="#6366f1" fill-opacity="0.2"/>
  <text x="143" y="384" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">Fast Cash Recycling</text>

  <!-- Box 2: High-Margin Accessories -->
  <rect x="286" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="298" y="115" width="202" height="30" rx="6" fill="#10b981" fill-opacity="0.15"/>
  <text x="399" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">High-Margin Accessories (30%)</text>
  <text x="310" y="175" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Target Margin: 60% - 80%</text>
  <text x="310" y="205" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Turnover Speed: 30 - 60 Days</text>
  <text x="310" y="235" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Working Capital Role:</text>
  <text x="310" y="260" font-family="sans-serif" font-size="10" fill="#94a3b8">Maximizes Average Order Value (AOV) and boosts basket profit margins.</text>
  <rect x="298" y="365" width="202" height="30" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="399" y="384" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Highest Profit Cushion</text>

  <!-- Box 3: Clearance SKUs -->
  <rect x="544" y="100" width="226" height="310" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="556" y="115" width="202" height="30" rx="6" fill="#ef4444" fill-opacity="0.15"/>
  <text x="657" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">Seasonal / Clearance (15%)</text>
  <text x="568" y="175" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Target Margin: 15% - 25%</text>
  <text x="568" y="205" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Turnover Speed: &gt; 90 Days</text>
  <text x="568" y="235" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Working Capital Role:</text>
  <text x="568" y="260" font-family="sans-serif" font-size="10" fill="#94a3b8">Slow capital trap. Liquidate quickly to avoid long-term FBA storage surcharges.</text>
  <rect x="556" y="365" width="202" height="30" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="657" y="384" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">Liquidate to Free Capital</text>
</svg>
