<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMargin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradMargin2)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Keystone Pricing &amp; Target Margin Mathematics</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Formulas for converting sourcing cost into wholesale price and retail MSRP</text>

  <!-- Formula Card 1: Target Margin Formula -->
  <rect x="50" y="100" width="330" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="65" y="115" width="300" height="30" rx="6" fill="#10b981" fill-opacity="0.15"/>
  <text x="215" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">Target Profit Margin Formula</text>

  <text x="75" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Selling Price Formula:</text>
  <rect x="75" y="195" width="280" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="215" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Price = Cost / (1 - Margin %)</text>

  <text x="75" y="270" font-family="sans-serif" font-size="11" fill="#cbd5e1">Worked Example (50% Target Margin):</text>
  <text x="75" y="295" font-family="monospace" font-size="12" fill="#94a3b8">• Sourcing Cost = $12.00</text>
  <text x="75" y="318" font-family="monospace" font-size="12" fill="#94a3b8">• Price = $12.00 / (1 - 0.50) = $24.00</text>
  <text x="75" y="341" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">• Dollar Profit = $12.00 (50.0% Margin)</text>

  <!-- Formula Card 2: Markup Formula -->
  <rect x="420" y="100" width="330" height="310" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="435" y="115" width="300" height="30" rx="6" fill="#6366f1" fill-opacity="0.15"/>
  <text x="585" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">Target Markup Formula</text>

  <text x="445" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Selling Price Formula:</text>
  <rect x="445" y="195" width="280" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="585" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="#818cf8" text-anchor="middle">Price = Cost * (1 + Markup %)</text>

  <text x="445" y="270" font-family="sans-serif" font-size="11" fill="#cbd5e1">Worked Example (50% Cost Markup):</text>
  <text x="445" y="295" font-family="monospace" font-size="12" fill="#94a3b8">• Sourcing Cost = $12.00</text>
  <text x="445" y="318" font-family="monospace" font-size="12" fill="#94a3b8">• Price = $12.00 * (1 + 0.50) = $18.00</text>
  <text x="445" y="341" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">• Dollar Profit = $6.00 (ONLY 33.3% Margin!)</text>
</svg>
