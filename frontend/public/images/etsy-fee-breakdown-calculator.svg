<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="48" cy="49" r="6" fill="#ef4444"/>
  <circle cx="68" cy="49" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="49" r="6" fill="#10b981"/>
  <text x="110" y="54" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Etsy Seller Fee &amp; Profit Breakdown Studio (2026 Schedule)</text>
  <rect x="630" y="37" width="130" height="24" rx="12" fill="url(#orangeGrad)"/>
  <text x="695" y="53" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Live Calculator</text>

  <!-- Left Inputs Card -->
  <rect x="24" y="90" width="360" height="336" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" letter-spacing="1">LISTING INPUT PARAMETERS</text>
  
  <rect x="44" y="135" width="320" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">Item Selling Price</text>
  <text x="348" y="160" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="end">$100.00</text>

  <rect x="44" y="187" width="320" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="212" font-family="sans-serif" font-size="12" fill="#cbd5e1">Shipping Charged to Buyer</text>
  <text x="348" y="212" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="end">$0.00</text>

  <rect x="44" y="239" width="320" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="264" font-family="sans-serif" font-size="12" fill="#cbd5e1">Crafting / Production Cost</text>
  <text x="348" y="264" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="end">$56.00</text>

  <rect x="44" y="291" width="320" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="316" font-family="sans-serif" font-size="12" fill="#cbd5e1">Etsy Offsite Ads Option</text>
  <text x="348" y="316" font-family="monospace" font-size="12" font-weight="bold" fill="#f97316" text-anchor="end">No Ads (0%)</text>

  <rect x="44" y="343" width="320" height="65" rx="8" fill="#0f172a" stroke="#f97316" stroke-opacity="0.4"/>
  <text x="56" y="365" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f97316">2026 ETSY MANDATORY FEES</text>
  <text x="56" y="385" font-family="sans-serif" font-size="11" fill="#94a3b8">Listing: $0.20 | Transaction: 6.5% | Processing: 3% + 25¢</text>

  <!-- Right Results Card -->
  <rect x="408" y="90" width="368" height="336" rx="12" fill="#1e293b" stroke="#f97316" stroke-opacity="0.5"/>
  <text x="428" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f97316" letter-spacing="1">NET TAKE-HOME PROFIT</text>

  <text x="428" y="165" font-family="monospace" font-size="38" font-weight="extrabold" fill="#10b981">$34.05</text>
  <rect x="625" y="133" font-size="12" width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="690" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">34.0% Margin</text>

  <!-- Donut Bar Visualization -->
  <rect x="428" y="190" width="328" height="18" rx="9" fill="#0f172a"/>
  <rect x="428" y="190" width="183" height="18" rx="9" fill="#6366f1"/>
  <rect x="611" y="190" width="33" height="18" rx="0" fill="#f97316"/>
  <rect x="644" y="190" width="112" height="18" rx="9" fill="#10b981"/>

  <g font-family="sans-serif" font-size="11">
    <circle cx="438" cy="235" r="5" fill="#6366f1"/>
    <text x="450" y="239" fill="#cbd5e1">Item Crafting Cost</text>
    <text x="748" y="239" font-family="monospace" fill="#f8fafc" text-anchor="end">$56.00 (56.0%)</text>

    <circle cx="438" cy="265" r="5" fill="#f97316"/>
    <text x="450" y="269" fill="#cbd5e1">Etsy Platform Fees Cut</text>
    <text x="748" y="269" font-family="monospace" fill="#f97316" text-anchor="end">$9.95 (9.9%)</text>

    <circle cx="438" cy="295" r="5" fill="#10b981"/>
    <text x="450" y="299" fill="#cbd5e1">Net Profit Margin</text>
    <text x="748" y="299" font-family="monospace" fill="#10b981" font-weight="bold" text-anchor="end">$34.05 (34.0%)</text>
  </g>

  <rect x="428" y="325" width="328" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="440" y="348" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Fee Breakdown Detail:</text>
  <text x="440" y="368" font-family="sans-serif" font-size="11" fill="#94a3b8">• Listing Renewal Fee: -$0.20</text>
  <text x="440" y="386" font-family="sans-serif" font-size="11" fill="#94a3b8">• Transaction Fee (6.5%): -$6.50 | Payment Fee: -$3.25</text>
</svg>
