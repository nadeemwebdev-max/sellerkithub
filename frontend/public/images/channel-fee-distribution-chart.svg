<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradComp2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradComp2)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Sales Channel Fee Distribution &amp; Traffic vs. Control Trade-Off</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Balancing commission overhead against customer data ownership and built-in organic traffic</text>

  <!-- Graphic Bar Chart -->
  <rect x="60" y="110" width="680" height="260" rx="12" fill="#1e293b" stroke="#334155"/>

  <!-- Y-Axis Lines -->
  <line x1="120" y1="140" x2="700" y2="140" stroke="#334155" stroke-dasharray="4"/>
  <text x="110" y="144" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">60%</text>

  <line x1="120" y1="190" x2="700" y2="190" stroke="#334155" stroke-dasharray="4"/>
  <text x="110" y="194" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">40%</text>

  <line x1="120" y1="240" x2="700" y2="240" stroke="#334155" stroke-dasharray="4"/>
  <text x="110" y="244" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">20%</text>

  <line x1="120" y1="290" x2="700" y2="290" stroke="#334155"/>
  <text x="110" y="294" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">0%</text>

  <!-- Bars -->
  <!-- Shopify Bar -->
  <rect x="160" y="150" width="70" height="140" rx="4" fill="#10b981"/>
  <text x="195" y="140" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">50.5%</text>
  <text x="195" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Shopify</text>

  <!-- Etsy Bar -->
  <rect x="290" y="175" width="70" height="115" rx="4" fill="#f97316"/>
  <text x="325" y="165" font-family="monospace" font-size="12" font-weight="bold" fill="#f97316" text-anchor="middle">43.5%</text>
  <text x="325" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Etsy</text>

  <!-- Amazon FBA Bar -->
  <rect x="420" y="183" width="70" height="107" rx="4" fill="#f59e0b"/>
  <text x="455" y="173" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">41.1%</text>
  <text x="455" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Amazon FBA</text>

  <!-- eBay Bar -->
  <rect x="550" y="188" width="70" height="102" rx="4" fill="#3b82f6"/>
  <text x="585" y="178" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">40.2%</text>
  <text x="585" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">eBay</text>

  <text x="400" y="350" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Net Take-Home Margin Percentage per Channel</text>
</svg>
