<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAmz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradAmz)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Amazon FBA vs FBM Unit Economics Studio (2026 Rates)</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Comparing fulfillment costs, referral rates, PPC ad spend, and net margins side by side</text>

  <!-- Left: Amazon FBA -->
  <rect x="30" y="95" width="355" height="325" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="44" y="110" width="327" height="34" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="207" y="132" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Fulfillment by Amazon (FBA)</text>

  <g font-family="sans-serif" font-size="11" fill="#cbd5e1">
    <text x="54" y="175">Selling Price:</text> <text x="355" y="175" font-family="monospace" font-weight="bold" fill="#f8fafc" text-anchor="end">$34.99</text>
    <text x="54" y="200">Sourcing COGS:</text> <text x="355" y="200" font-family="monospace" fill="#94a3b8" text-anchor="end">-$9.00</text>
    <text x="54" y="225">Inbound Freight:</text> <text x="355" y="225" font-family="monospace" fill="#94a3b8" text-anchor="end">-$1.50</text>
    <text x="54" y="250">Referral Fee (15%):</text> <text x="355" y="250" font-family="monospace" fill="#ef4444" text-anchor="end">-$5.25</text>
    <text x="54" y="275">FBA Pick &amp; Pack Fee:</text> <text x="355" y="275" font-family="monospace" fill="#ef4444" text-anchor="end">-$3.86</text>
    <text x="54" y="300">Monthly Storage &amp; PPC:</text> <text x="355" y="300" font-family="monospace" fill="#ef4444" text-anchor="end">-$3.35</text>
  </g>

  <line x1="44" y1="318" x2="371" y2="318" stroke="#334155"/>

  <text x="54" y="355" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">FBA NET PROFIT:</text>
  <text x="355" y="355" font-family="monospace" font-size="24" font-weight="bold" fill="#10b981" text-anchor="end">$12.03</text>
  <text x="355" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="end">34.4% Net Margin</text>

  <rect x="44" y="388" width="327" height="22" rx="4" fill="#0f172a"/>
  <text x="207" y="403" font-family="sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Includes Prime Badge &amp; Free Customer Shipping</text>

  <!-- Right: Amazon FBM -->
  <rect x="415" y="95" width="355" height="325" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="429" y="110" width="327" height="34" rx="6" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="592" y="132" font-family="sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">Fulfillment by Merchant (FBM)</text>

  <g font-family="sans-serif" font-size="11" fill="#cbd5e1">
    <text x="439" y="175">Selling Price:</text> <text x="740" y="175" font-family="monospace" font-weight="bold" fill="#f8fafc" text-anchor="end">$34.99</text>
    <text x="439" y="200">Sourcing COGS:</text> <text x="740" y="200" font-family="monospace" fill="#94a3b8" text-anchor="end">-$9.00</text>
    <text x="439" y="225">Merchant Postage (USPS):</text> <text x="740" y="225" font-family="monospace" fill="#ef4444" text-anchor="end">-$6.00</text>
    <text x="439" y="250">Referral Fee (15%):</text> <text x="740" y="250" font-family="monospace" fill="#ef4444" text-anchor="end">-$5.25</text>
    <text x="439" y="275">Packaging &amp; Supplies:</text> <text x="740" y="275" font-family="monospace" fill="#94a3b8" text-anchor="end">-$0.80</text>
    <text x="439" y="300">PPC Ad Spend:</text> <text x="740" y="300" font-family="monospace" fill="#ef4444" text-anchor="end">-$3.00</text>
  </g>

  <line x1="429" y1="318" x2="756" y2="318" stroke="#334155"/>

  <text x="439" y="355" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">FBM NET PROFIT:</text>
  <text x="740" y="355" font-family="monospace" font-size="24" font-weight="bold" fill="#60a5fa" text-anchor="end">$10.94</text>
  <text x="740" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="end">31.3% Net Margin</text>

  <rect x="429" y="388" width="327" height="22" rx="4" fill="#0f172a"/>
  <text x="592" y="403" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Seller Handles Warehouse Packing &amp; Returns</text>
</svg>
