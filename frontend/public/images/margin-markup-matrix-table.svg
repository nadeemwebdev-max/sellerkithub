<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMargin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradMargin)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Wholesale Profit Margin vs. Markup Multiplier Matrix</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Interactive pricing ladder generated on a $12.00 Sourcing / Unit Manufacturing Cost</text>

  <!-- Table Header -->
  <rect x="30" y="95" width="740" height="35" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">TARGET RATE %</text>
  <text x="220" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">PRICE (TARGET MARGIN)</text>
  <text x="430" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">PRICE (TARGET MARKUP)</text>
  <text x="730" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="end">EFFECTIVE MARGIN</text>

  <!-- Row 1: 20% -->
  <rect x="30" y="138" width="740" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="166" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">20% Tier</text>
  <text x="220" y="166" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">$15.00 ($3.00 profit)</text>
  <text x="430" y="166" font-family="monospace" font-size="13" fill="#6366f1">$14.40 ($2.40 profit)</text>
  <text x="730" y="166" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="end">16.7%</text>

  <!-- Row 2: 33.3% -->
  <rect x="30" y="192" width="740" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">33.3% Tier</text>
  <text x="220" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">$18.00 ($6.00 profit)</text>
  <text x="430" y="220" font-family="monospace" font-size="13" fill="#6366f1">$16.00 ($4.00 profit)</text>
  <text x="730" y="220" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="end">25.0%</text>

  <!-- Row 3: 50% KEYSTONE -->
  <rect x="30" y="246" width="740" height="46" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
  <text x="50" y="274" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b">50% Keystone ⭐</text>
  <text x="220" y="274" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">$24.00 ($12.00 profit)</text>
  <text x="430" y="274" font-family="monospace" font-size="14" fill="#6366f1">$18.00 ($6.00 profit)</text>
  <text x="730" y="274" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="end">33.3%</text>

  <!-- Row 4: 75% High DTC -->
  <rect x="30" y="300" width="740" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="328" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">75% High DTC</text>
  <text x="220" y="328" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">$48.00 ($36.00 profit)</text>
  <text x="430" y="328" font-family="monospace" font-size="13" fill="#6366f1">$21.00 ($9.00 profit)</text>
  <text x="730" y="328" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="end">42.9%</text>

  <!-- Footnote -->
  <text x="400" y="385" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Notice: A 50% Markup ($18.00) only yields a 33.3% Margin. Double cost ($24.00) for 50% Keystone Margin!</text>
</svg>
