<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradImg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradImg)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">1:1 Square Product Photo Padding &amp; Resizing Studio</text>
  <text x="400" y="68" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Convert non-square photographs to crisp 2000x2000px square images without cropping or stretching</text>

  <!-- Left: Original Rectangular Photo -->
  <rect x="50" y="100" width="310" height="310" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="205" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">Original Rectangular Photo (16:9)</text>

  <!-- Rectangular Content -->
  <rect x="75" y="170" width="260" height="150" rx="8" fill="#334155"/>
  <circle cx="150" cy="245" r="35" fill="#f59e0b"/>
  <rect x="210" y="225" width="100" height="40" rx="4" fill="#60a5fa"/>
  <text x="205" y="350" font-family="monospace" font-size="12" fill="#ef4444" text-anchor="middle">1920 x 1080 px (Triggers Mobile Crop)</text>

  <!-- Arrow Transition -->
  <text x="400" y="255" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">➔</text>
  <text x="400" y="280" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">+15% White Padding</text>

  <!-- Right: Padded 1:1 Square Output -->
  <rect x="440" y="100" width="310" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="595" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">1:1 Square Amazon Photo (Pure White)</text>

  <!-- White 1:1 Canvas -->
  <rect x="475" y="150" width="240" height="240" rx="8" fill="#ffffff"/>
  <!-- Centered Rectangular Photo -->
  <rect x="495" y="200" width="200" height="140" rx="4" fill="#334155"/>
  <circle cx="550" cy="270" r="28" fill="#f59e0b"/>
  <rect x="600" y="255" width="80" height="30" rx="4" fill="#60a5fa"/>

  <text x="595" y="405" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">2000 x 2000 px (100% Zoom Compliant)</text>
</svg>
